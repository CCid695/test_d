<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mini-devin Dashboard</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.3rem; }
  textarea { width: 100%; height: 4.5rem; font: inherit; box-sizing: border-box; }
  button { cursor: pointer; }
  #status { color: #555; margin: 0.5rem 0 1.5rem; }
  .job { border: 1px solid #ddd; border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 1rem; }
  .job h3 { margin: 0 0 0.25rem; font-size: 1rem; }
  .mode { font-weight: 600; }
  .mode.parallel { color: #0a7d2c; }
  .mode.serial { color: #a35b00; }
  .mode.collaborate { color: #6a1b9a; }
  .reason { color: #666; font-size: 0.85rem; margin: 0.25rem 0 0.75rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 0.3rem 0.4rem; border-bottom: 1px solid #eee; vertical-align: top; }
  .badge { padding: 0.1rem 0.5rem; border-radius: 10px; font-size: 0.75rem; color: #fff; }
  .badge.queued { background: #999; }
  .badge.running { background: #1a6fd1; }
  .badge.done { background: #0a7d2c; }
  .badge.error { background: #c0392b; }
  .badge.stopped { background: #7a7a7a; }
  .badge.waiting { background: #b8860b; }
  .badge.skipped { background: #bbb; color: #333; }
  .logs { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 0.75rem; max-height: 8rem; overflow: auto; background: #fafafa; padding: 0.4rem; margin-top: 0.25rem; }
  .task-cell { max-width: 22rem; white-space: pre-wrap; }
  .final-result { border: 1px solid #6a1b9a; border-radius: 6px; padding: 0.6rem 0.8rem; margin-bottom: 0.75rem; background: #faf5ff; }
  .final-result h4 { margin: 0 0 0.4rem; font-size: 0.9rem; color: #6a1b9a; }
  .final-result pre { white-space: pre-wrap; font-family: inherit; margin: 0.4rem 0 0; font-size: 0.85rem; }
  .final-warning { color: #c0392b; font-size: 0.85rem; margin-top: 0.4rem; }
  .shared-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; font-size: 0.85rem; }
  .integrator-row { border-top: 2px solid #6a1b9a; }
  #token-bar { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 1rem; }
  #token-bar input { flex: 1; font: inherit; }
  #token-hint { color: #c0392b; font-size: 0.85rem; margin: -0.5rem 0 1rem; display: none; }
</style>
</head>
<body>
<h1>mini-devin Dashboard</h1>

<div id="token-bar">
  <input id="token" type="password" placeholder="dashboard token (see README / startup log)">
  <button id="save-token">Save</button>
</div>
<div id="token-hint">Token invalid or missing, run the kubectl command printed in the startup log to get the token, paste it above and save.</div>

<textarea id="task" placeholder="Describe a task, e.g.: write three unrelated static webpages: cat, dog, weather"></textarea>
<button id="submit">Submit Task</button>
<div id="status">Loading...</div>
<div id="jobs"></div>

<script>
const submitBtn = document.getElementById('submit');
const taskInput = document.getElementById('task');
const statusEl = document.getElementById('status');
const jobsEl = document.getElementById('jobs');
const tokenInput = document.getElementById('token');
const tokenHint = document.getElementById('token-hint');
const saveTokenBtn = document.getElementById('save-token');

try {
  tokenInput.value = localStorage.getItem('miniDevinToken') || '';
} catch (e) { /* private browsing etc. — just start blank */ }

saveTokenBtn.addEventListener('click', () => {
  try {
    localStorage.setItem('miniDevinToken', tokenInput.value.trim());
  } catch (e) { /* ignore */ }
  tokenHint.style.display = 'none';
});

// Authenticated POST — never injects the token into the page itself (it's
// typed/pasted by the person using this browser), only attaches it as a
// header on same-origin requests this page initiates.
async function authPost(path) {
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${tokenInput.value.trim()}` },
  });
  if (res.status === 401) tokenHint.style.display = 'block';
  else tokenHint.style.display = 'none';
  return res;
}

submitBtn.addEventListener('click', async () => {
  const task = taskInput.value.trim();
  if (!task) return;
  submitBtn.disabled = true;
  try {
    const res = await fetch('/api/tasks', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${tokenInput.value.trim()}`,
      },
      body: JSON.stringify({ task }),
    });
    if (res.status === 401) tokenHint.style.display = 'block';
    else { tokenHint.style.display = 'none'; if (res.ok) taskInput.value = ''; }
    await refresh();
  } finally {
    submitBtn.disabled = false;
  }
});

jobsEl.addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  btn.disabled = true;
  await authPost(`/api/agents/${btn.dataset.agent}/${btn.dataset.action}`);
  await refresh();
});

function badge(status) {
  const span = document.createElement('span');
  span.className = 'badge ' + status;
  span.textContent = status;
  return span;
}

function renderAgentRow(agent) {
  const tr = document.createElement('tr');

  const cells = {
    id: agent.id,
    container: agent.container_name,
  };

  const idTd = document.createElement('td');
  idTd.textContent = agent.id;
  tr.appendChild(idTd);

  const statusTd = document.createElement('td');
  statusTd.appendChild(badge(agent.status));
  tr.appendChild(statusTd);

  const taskTd = document.createElement('td');
  taskTd.className = 'task-cell';
  taskTd.textContent = agent.task;
  tr.appendChild(taskTd);

  const actionTd = document.createElement('td');
  actionTd.textContent = agent.last_action || '';
  tr.appendChild(actionTd);

  const urlTd = document.createElement('td');
  if (agent.url) {
    const a = document.createElement('a');
    a.href = agent.url; a.target = '_blank'; a.textContent = agent.url;
    urlTd.appendChild(a);
  }
  tr.appendChild(urlTd);

  const ctrlTd = document.createElement('td');
  if (agent.status === 'queued' || agent.status === 'running') {
    const stopBtn = document.createElement('button');
    stopBtn.textContent = 'Stop'; stopBtn.dataset.action = 'stop'; stopBtn.dataset.agent = agent.id;
    ctrlTd.appendChild(stopBtn);
  }
  const killBtn = document.createElement('button');
  killBtn.textContent = 'Kill'; killBtn.dataset.action = 'kill'; killBtn.dataset.agent = agent.id;
  ctrlTd.appendChild(killBtn);
  tr.appendChild(ctrlTd);

  return tr;
}

function renderCollaborateAgentRow(agent, roleNameById) {
  const tr = document.createElement('tr');
  if (agent.kind === 'integrator') tr.className = 'integrator-row';

  const roleTd = document.createElement('td');
  roleTd.textContent = agent.role || agent.id;
  tr.appendChild(roleTd);

  const depTd = document.createElement('td');
  if (agent.kind === 'integrator') {
    depTd.textContent = 'All roles';
  } else if (agent.depends_on && agent.depends_on.length) {
    depTd.textContent = agent.depends_on.map((id) => roleNameById[id] || id).join(', ');
  } else {
    depTd.textContent = '-';
  }
  tr.appendChild(depTd);

  const statusTd = document.createElement('td');
  statusTd.appendChild(badge(agent.status));
  tr.appendChild(statusTd);

  const taskTd = document.createElement('td');
  taskTd.className = 'task-cell';
  taskTd.textContent = agent.task;
  tr.appendChild(taskTd);

  const actionTd = document.createElement('td');
  actionTd.textContent = agent.last_action || '';
  tr.appendChild(actionTd);

  const ctrlTd = document.createElement('td');
  if (['queued', 'running', 'waiting'].includes(agent.status)) {
    const stopBtn = document.createElement('button');
    stopBtn.textContent = 'Stop'; stopBtn.dataset.action = 'stop'; stopBtn.dataset.agent = agent.id;
    ctrlTd.appendChild(stopBtn);
  }
  tr.appendChild(ctrlTd);

  return tr;
}

function renderFinalResult(job) {
  const box = document.createElement('div');
  box.className = 'final-result';

  const h4 = document.createElement('h4');
  h4.textContent = 'Final Result (Integration and Verification)';
  box.appendChild(h4);

  if (!job.final_status) {
    const p = document.createElement('div');
    p.textContent = 'Waiting for integrator to verify after 3 roles complete...';
    box.appendChild(p);
    return box;
  }

  box.appendChild(badge(job.final_status));

  const pre = document.createElement('pre');
  pre.textContent = job.final_result || '';
  box.appendChild(pre);

  if (job.final_verified === false) {
    const warn = document.createElement('div');
    warn.className = 'final-warning';
    warn.textContent = 'Integrator did not execute any verification commands, conclusion is unverified';
    box.appendChild(warn);
  }

  return box;
}

function renderSharedBar(agents) {
  const bar = document.createElement('div');
  bar.className = 'shared-bar';

  const left = document.createElement('span');
  const withUrl = agents.find((a) => a.url);
  if (withUrl) {
    left.appendChild(document.createTextNode('Shared sandbox: '));
    const a = document.createElement('a');
    a.href = withUrl.url; a.target = '_blank'; a.textContent = withUrl.url;
    left.appendChild(a);
  } else {
    left.textContent = 'Shared sandbox: (not ready yet)';
  }
  bar.appendChild(left);

  const killBtn = document.createElement('button');
  killBtn.textContent = 'Kill entire task (delete shared sandbox)';
  killBtn.dataset.action = 'kill';
  killBtn.dataset.agent = agents.length ? agents[0].id : '';
  bar.appendChild(killBtn);

  return bar;
}

function renderLogs(agent) {
  const details = document.createElement('details');
  const summary = document.createElement('summary');
  summary.textContent = `Logs (${agent.id})`;
  details.appendChild(summary);
  const pre = document.createElement('div');
  pre.className = 'logs';
  pre.textContent = agent.logs.join('\n');
  details.appendChild(pre);
  return details;
}

async function refresh() {
  const res = await fetch('/api/state');
  const state = await res.json();

  statusEl.textContent = `Running ${state.running} / ${state.max_concurrent}, queued ${state.queued}, waiting for dependencies ${state.waiting || 0}`;

  jobsEl.innerHTML = '';
  const agentsByJob = {};
  for (const a of state.agents) {
    (agentsByJob[a.job_id] ||= []).push(a);
  }

  for (const job of [...state.jobs].reverse()) {
    const div = document.createElement('div');
    div.className = 'job';

    const h3 = document.createElement('h3');
    h3.textContent = job.task;
    div.appendChild(h3);

    if (job.mode) {
      const modeEl = document.createElement('div');
      modeEl.innerHTML = '';
      const modeSpan = document.createElement('span');
      modeSpan.className = 'mode ' + job.mode;
      modeSpan.textContent = job.mode;
      modeEl.appendChild(document.createTextNode('AI decision: '));
      modeEl.appendChild(modeSpan);
      div.appendChild(modeEl);

      const reasonEl = document.createElement('div');
      reasonEl.className = 'reason';
      reasonEl.textContent = job.reason;
      div.appendChild(reasonEl);
    } else {
      const planningEl = document.createElement('div');
      planningEl.className = 'reason';
      planningEl.textContent = 'Planning...';
      div.appendChild(planningEl);
    }

    const agents = agentsByJob[job.id] || [];

    if (job.mode === 'collaborate') {
      div.appendChild(renderFinalResult(job));
      if (agents.length) div.appendChild(renderSharedBar(agents));

      const roleNameById = {};
      for (const a of agents) roleNameById[a.id] = a.role || a.id;

      const table = document.createElement('table');
      const thead = document.createElement('tr');
      for (const h of ['Role', 'Dependencies', 'Status', 'Task', 'Last Action', 'Actions']) {
        const th = document.createElement('th');
        th.textContent = h;
        thead.appendChild(th);
      }
      table.appendChild(thead);

      const roles = agents.filter((a) => a.kind === 'role');
      const integrator = agents.filter((a) => a.kind === 'integrator');
      for (const agent of [...roles, ...integrator]) {
        table.appendChild(renderCollaborateAgentRow(agent, roleNameById));
      }
      div.appendChild(table);
    } else {
      const table = document.createElement('table');
      const thead = document.createElement('tr');
      for (const h of ['Agent', '状态', '任务', '最近动作', '链接', '操作']) {
        const th = document.createElement('th');
        th.textContent = h;
        thead.appendChild(th);
      }
      table.appendChild(thead);

      for (const agent of agents) table.appendChild(renderAgentRow(agent));
      div.appendChild(table);
    }

    for (const agent of agents) div.appendChild(renderLogs(agent));

    jobsEl.appendChild(div);
  }
}

refresh();
setInterval(refresh, 1500);
</script>
</body>
</html>
