name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python syntax check
        run: python -m py_compile mini_devin.py orchestrator.py dashboard.py k8s_backend.py

      - name: Shell syntax check
        run: |
          bash -n install.sh
          bash -n uninstall.sh

      - name: Shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."

      - name: Verify requirements.txt resolves
        run: |
          python -m venv .venv-ci
          .venv-ci/bin/pip install --upgrade pip
          .venv-ci/bin/pip install -r requirements.txt

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create KinD cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: mini-devin-test

      # Every sandbox is a real Kubernetes Pod now (no Docker path left to
      # test separately), so this one job covers everything that doesn't
      # need Ollama: fakes in test_orchestrator.py/test_agent.py, pure
      # manifest-builder assertions in test_k8s_manifests.py, and the real
      # exec-over-websocket/stdin-tar/per-sandbox-client-isolation code in
      # test_k8s_sandbox.py against a real API server.
      #
      # Deliberately doesn't install ingress-nginx: test_k8s_sandbox.py
      # never touches Ingress routing, only creates/deletes the object
      # (valid even with no controller watching it); actual Ingress +
      # port-forward routing is checked manually against minikube (see
      # README.md's manual checklist).
      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        env:
          MINI_DEVIN_REQUIRE_K8S: "1"
          MINI_DEVIN_KUBE_CONTEXT: kind-mini-devin-test
        run: pytest tests/ -v
