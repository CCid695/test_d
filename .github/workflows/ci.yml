name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python syntax check
        run: python -m py_compile mini_devin.py

      - name: Shell syntax check
        run: |
          bash -n install.sh
          bash -n uninstall.sh

      - name: Shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."

      - name: Verify requirements.txt resolves
        run: |
          python -m venv .venv-ci
          .venv-ci/bin/pip install --upgrade pip
          .venv-ci/bin/pip install -r requirements.txt

  sandbox-smoke-test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # GitHub-hosted ubuntu runners already have a Docker daemon running,
      # so this exercises the real container control plane — no Ollama/LLM
      # involved, since that part is network-dependent and non-deterministic.
      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run Docker sandbox smoke test
        run: pytest tests/ -v
